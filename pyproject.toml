[build-system]
requires = ["setuptools>=61.0", "wheel", "psutil"]
build-backend = "setuptools.build_meta"

[project]
name = "ollm"
version = "1.0.4"
description = "LLM Inference for Large-Context Offline Workloads"
authors = [
  { name="Anuar Sharafudinov", email="anuarsh@ailabs.us" }
]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>2.6.0", #tested: 2.8.0
    "transformers==4.57.0", #tested: 4.55.4, 4.56.1, 4.57.0(ollm1.0.3)
    "accelerate",
    "flash-linear-attention",
    "flash-attn" #tested: 2.7.4.post1
]

[project.optional-dependencies]
# The inference dependencies above are unchanged. These features are opt-in.
tools = ["jsonschema>=4.23,<5"]
mcp = ["jsonschema>=4.23,<5", "mcp>=1.30,<2"]
gpt-oss-tools = ["jsonschema>=4.23,<5", "openai-harmony>=0.0.8,<1"]
qwen-agent = ["jsonschema>=4.23,<5", "qwen-agent>=0.0.34,<0.1"]
multimodal = ["pillow>=10,<13"]
agents = [
    "jsonschema>=4.23,<5",
    "mcp>=1.30,<2",
    "openai-harmony>=0.0.8,<1",
    "qwen-agent[mcp]>=0.0.34,<0.1",
    "pillow>=10,<13",
]
test-tools = ["pytest>=8,<10", "jsonschema>=4.23,<5"]
test-bounded = ["pytest>=8,<10", "safetensors>=0.5,<1", "jsonschema>=4.23,<5"]

[project.urls]
"Homepage" = "https://github.com/Mega4alik/ollm"
"Bug Tracker" = "https://github.com/Mega4alik/ollm/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
