name: Bounded model runtime
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_reference:
        description: Run optional Transformers reference comparisons
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'torch>2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'pytest>=8,<10' 'safetensors>=0.5,<1' 'numpy>=1.26' 'jsonschema>=4.23,<5'
      - run: python -m pytest -c pytest-bounded.ini -m 'not reference' -q
      - run: python -m pytest -c pytest-tools.ini -m 'not sdk and not model' -q
      - run: python -m compileall -q src/ollm/bounded examples/bounded tests/bounded
  native-reference:
    if: github.event_name == 'workflow_dispatch' && inputs.run_reference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OLLM_RUN_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'pytest>=8,<10' 'safetensors>=0.5,<1' 'numpy>=1.26' 'jsonschema>=4.23,<5' 'transformers==4.57.0' 'accelerate'
      - run: python -m pytest -c pytest-bounded.ini -m reference -q -rs
# CUDA memory qualification is intentionally local/manual. Never execute
# untrusted pull-request code on a self-hosted GPU or download giant models in CI.
